
services:
  backend:
    build:
      context: ./resume_backend
    env_file:
      - ./resume_backend/.env
    volumes:
      - ./resume_backend/data:/app/data
      - ./resume_backend/media:/app/media
      - ./resume_backend/staticfiles:/app/staticfiles
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./Tsertsvas_Portfolio
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./resume_backend/media:/var/www/media:ro
      - ./resume_backend/staticfiles:/var/www/static:ro
    restart: unless-stopped
